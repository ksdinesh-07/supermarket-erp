name: Build Windows Executable

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller PyQt5 pymysql mysql-connector-python matplotlib
    
    - name: Build with PyInstaller
      run: |
        pyinstaller --onefile --windowed --name "SupermarketERP.exe" main.py
    
    - name: Upload executable
      uses: actions/upload-artifact@v4
      with:
        name: SupermarketERP-Windows
        path: dist/SupermarketERP.exe
