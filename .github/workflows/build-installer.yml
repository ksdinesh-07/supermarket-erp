name: Build Windows Installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  checks: write
  issues: write
  pull-requests: write
  statuses: write

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
      actions: read
      checks: write
      issues: write
      pull-requests: write
      statuses: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'
        architecture: 'x64'
    
    - name: Install Python dependencies
      shell: pwsh
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller PyQt5 matplotlib
    
    - name: Build executable with PyInstaller
      shell: pwsh
      run: |
        pyinstaller --onefile `
          --windowed `
          --name "SupermarketERP" `
          --add-data "ui/styles;ui/styles" `
          --add-data "database/*;database" `
          --hidden-import PyQt5.QtCore `
          --hidden-import PyQt5.QtGui `
          --hidden-import PyQt5.QtWidgets `
          --hidden-import matplotlib `
          --collect-all matplotlib `
          main.py
    
    - name: Verify executable was created
      shell: pwsh
      run: |
        if (-not (Test-Path "dist\SupermarketERP.exe")) {
          exit 1
        }
    
    - name: Download Inno Setup
      shell: pwsh
      run: |
        Invoke-WebRequest -Uri "https://jrsoftware.org/download.php/is.exe" -OutFile "innosetup.exe"
    
    - name: Install Inno Setup silently
      shell: pwsh
      run: |
        Start-Process -FilePath ".\innosetup.exe" -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART" -Wait
    
    - name: Create installer with Inno Setup
      shell: pwsh
      run: |
        & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss
        if ($LASTEXITCODE -ne 0) {
          exit 1
        }
    
    - name: Verify installer was created
      shell: pwsh
      run: |
        if (-not (Test-Path "installer\SupermarketERP_Setup.exe")) {
          exit 1
        }
    
    - name: Upload installer as artifact
      uses: actions/upload-artifact@v4
      with:
        name: SupermarketERP-Installer
        path: installer/SupermarketERP_Setup.exe
        retention-days: 90
    
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: |
          installer/SupermarketERP_Setup.exe
          README.md
        name: Supermarket ERP ${{ github.ref_name }}
        body: |
          Supermarket ERP System ${{ github.ref_name }}
          
          Default Login: admin / admin123
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
