name: Build Windows Installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller PyQt5 matplotlib
    
    - name: Build executable
      run: |
        pyinstaller --onefile --windowed --name "SupermarketERP.exe" `
          --add-data "ui/styles;ui/styles" `
          --add-data "database/*;database" `
          main.py
    
    - name: Download Inno Setup
      run: |
        Invoke-WebRequest -Uri "https://jrsoftware.org/download.php/is.exe" -OutFile "innosetup.exe"
    
    - name: Install Inno Setup
      run: |
        Start-Process -FilePath ".\innosetup.exe" -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART" -Wait
    
    - name: Create installer
      run: |
        & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss
    
    - name: Upload installer
      uses: actions/upload-artifact@v4
      with:
        name: SupermarketERP-Installer
        path: installer/SupermarketERP_Setup.exe
    
    - name: Create Release
      uses: softprops/action-gh-release@v1
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: installer/SupermarketERP_Setup.exe
        name: Supermarket ERP ${{ github.ref_name }}
        body: |
          ## 🚀 Supermarket ERP Installer
          
          ### 📥 Download
          - Click on `SupermarketERP_Setup.exe` below to download
          
          ### 🔑 Default Login
          - Username: `admin`
          - Password: `admin123`
          
          ### ✨ Features
          - Complete POS System
          - Inventory Management
          - Customer Management
          - Online Orders
          - Self Checkout Kiosk
          - Reports & Analytics
          - SQLite Database (No setup needed!)
